{% extends 'base.html' %}
{% block title %}Create a Todo{% endblock %}
{% block content %}
<div class="bg-light grey_container">
  <div class="container">
    <div class="bd-masthead" id="content">
      <div class="container row justify-content-center todo_form_container">
        <div class="col-md-5 mb-5">
          <h1>Create a Todo</h1>
          <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="mb-3">
              <div class="form_generic">
                <label for="InputTitle" class="form-label">Title</label>
                <input type="text" class="form-control" id="InputTitle" name="title">
              </div>
              <div class="form_generic mt-3">
                <label for="InputDescription" class="form-label">Description</label>
                <input type="text" class="form-control" id="InputDescription" name="description">
              </div>
              <div class="mt-3 form-check">
                <input class="form-check-input" type="checkbox" id="CheckImportant" name="important">
                <label class="form-check-label" for="CheckImportant">Important</label>
              </div>
            </div>
            <div class="mt-3">
              <button type="submit" class="btn btn-primary">Create</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
