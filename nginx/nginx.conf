events {}

http {
    server_tokens off;
    keepalive_timeout 40s;

    # File types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Security headers
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), bluetooth=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://code.jquery.com https://cdn.jsdelivr.net https://kit.fontawesome.com; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:1m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:1m rate=2r/s;

    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # Max upload size
    client_max_body_size 2M;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    error_log /dev/stderr warn;

#     access_log /var/log/nginx/access.log main buffer=512k flush=1m;
#     error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;

    # Increase server instances in production! (to 2-3)
    upstream fastapi {
        server web:8000;
    }

    # HTTP SERVER - REDIRECT TO HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS SERVER
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        # SSL certificate paths
        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        # Basic SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # SSL performance
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Static files
        location /static/ {
            alias /app/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";

            # Try files before 404
            try_files $uri $uri/ =404;
        }

        # Health check (optional)
        location /health {
            access_log off;
            proxy_pass http://fastapi/health;
            proxy_connect_timeout 5s;   # FastAPI must respond in 5s
            proxy_read_timeout 5s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # FastAPI proxy
        location / {
            limit_conn conn 10;
            limit_req zone=api burst=20 nodelay;

#             proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
#             proxy_next_upstream_tries 1;
#             proxy_next_upstream_timeout 30s;

            # Buffer
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 16 4k;
            proxy_busy_buffers_size 16k;

            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (if needed later)
#             proxy_http_version 1.1;
#             proxy_set_header Upgrade $http_upgrade;
#             proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location ~ ^/users/(login|register)$ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://fastapi;
        }
    }
}